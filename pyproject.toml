[tool.black]
line-length = 100
target-version = ["py39"]
include = "\\.pyi?$"
extend-exclude = '''
/(
  \.git
| \.venv
| \.idea
| build
| dist
| yolo7_face
| spiga_project
| code_former
| research
| dataset
| models
| docker
)/
'''

[tool.pytest.ini_options]
# Put the repo root on sys.path so the tests can `import src...` regardless of how
# pytest is invoked.
pythonpath = ["."]
testpaths = ["tests"]
